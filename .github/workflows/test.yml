name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: unittest (${{ matrix.os }}, python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run the tests
        run: cd tests && env -u CLAUDE_CODE_REMOTE python3 -m unittest discover -s . -p "test_*.py"
